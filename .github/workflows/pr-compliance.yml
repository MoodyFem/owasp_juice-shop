name: 'PR Compliance Check'

on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  check-compliance:
    runs-on: ubuntu-latest
    steps:
      - name: "Initialize PR Information"
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd #v8.0.0
        id: init
        with:
          script: |
            const pr = context.payload.pull_request;
            core.setOutput('author', pr.user.login);

      - name: "Check Identity Policy"
        id: membership
        run: |
          if [ "${{ steps.init.outputs.author }}" = "MoodyFem" ]; then
            echo "is_member=true" >> $GITHUB_OUTPUT
            echo "Owner authentication verified. Bypassing compliance gates."
          else
            echo "is_member=false" >> $GITHUB_OUTPUT
            echo "External contributor detected. Enforcing gates."
          fi

      - name: "Check Target Branch"
        if: steps.membership.outputs.is_member == 'false'
        run: echo "Enforcing branch gates for external users."
